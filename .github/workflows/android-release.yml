name: Android release APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Version tag to build (for example v1.1.0)
        required: true
        type: string
      release_tag:
        description: Existing GitHub Release tag to receive the APK (optional)
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      ref:
        description: Version tag created by Release Please
        required: true
        type: string
      release_tag:
        description: Existing GitHub Release tag to receive the APK
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned APK
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      apk_name: ${{ steps.metadata.outputs.apk_name }}
      signed_artifact_name: ${{ steps.metadata.outputs.signed_artifact_name }}
      unsigned_apk_name: ${{ steps.metadata.outputs.unsigned_apk_name }}
      unsigned_artifact_name: ${{ steps.metadata.outputs.unsigned_artifact_name }}

    steps:
      - name: Resolve the trusted version tag
        id: source
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version_tag="${REQUESTED_REF#refs/tags/}"

          if [[ ! "$version_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Only semantic version tags such as v1.0.0 can be built." >&2
            exit 1
          fi

          if [[ -n "$RELEASE_TAG" && "$version_tag" != "$RELEASE_TAG" ]]; then
            echo "A GitHub Release can only receive an APK built from its own tag." >&2
            exit 1
          fi

          printf 'ref=%s\n' "$version_tag" >> "$GITHUB_OUTPUT"

      - name: Check out the version tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 1
          fetch-tags: true
          persist-credentials: false

      - name: Verify that the checkout is tagged
        shell: bash
        env:
          VERSION_TAG: ${{ steps.source.outputs.ref }}
        run: |
          tag_at_head="$(git tag --points-at HEAD --list "$VERSION_TAG")"
          if [[ "$tag_at_head" != "$VERSION_TAG" ]]; then
            echo "The checked-out commit is not tagged as $VERSION_TAG." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate Expo dependencies
        run: |
          npx expo install --check
          npm run doctor

      - name: Generate the production Android project
        env:
          APP_VARIANT: production
        run: npx expo prebuild --platform android --no-install

      - name: Configure an unsigned release build
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const buildFile = 'android/app/build.gradle';
          let contents = fs.readFileSync(buildFile, 'utf8');
          const buildTypesPattern = /^    buildTypes \{[\s\S]*?^    \}/m;
          const buildTypesMatch = contents.match(buildTypesPattern);

          if (!buildTypesMatch) {
            throw new Error('Could not locate buildTypes in generated build.gradle');
          }

          let buildTypes = buildTypesMatch[0];
          const releasePattern = /^        release \{[\s\S]*?^        \}/m;
          const releaseMatch = buildTypes.match(releasePattern);

          if (!releaseMatch) {
            throw new Error('Could not locate the generated release build type');
          }

          const signingPattern = /^\s*signingConfig\s*(?:=\s*)?signingConfigs\.debug\s*$/m;
          const signingMatches = releaseMatch[0].match(new RegExp(signingPattern.source, 'gm'));

          if (signingMatches?.length !== 1) {
            throw new Error('Generated release build type does not use exactly one debug signing config');
          }

          const unsignedRelease = releaseMatch[0].replace(signingPattern, '');
          if (/signingConfig/.test(unsignedRelease)) {
            throw new Error('Release build still contains a signing configuration');
          }

          buildTypes = buildTypes.replace(releaseMatch[0], unsignedRelease);
          contents = contents.replace(buildTypesMatch[0], buildTypes);

          if (!/^        debug \{[\s\S]*?signingConfig signingConfigs\.debug/m.test(buildTypes)) {
            throw new Error('Debug build type signing was modified unexpectedly');
          }

          fs.writeFileSync(buildFile, contents);
          NODE

      - name: Read release metadata
        id: metadata
        shell: bash
        env:
          VERSION_TAG: ${{ steps.source.outputs.ref }}
        run: |
          app_version="$(node -p "require('./app.json').expo.version")"
          if [[ ! "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Expo app version: $app_version" >&2
            exit 1
          fi

          if [[ "$VERSION_TAG" != "v$app_version" ]]; then
            echo "Version tag $VERSION_TAG does not match app version v$app_version." >&2
            exit 1
          fi

          printf 'apk_name=Jarling-v%s-android.apk\n' "$app_version" >> "$GITHUB_OUTPUT"
          printf 'signed_artifact_name=jarling-v%s-android-signed\n' "$app_version" >> "$GITHUB_OUTPUT"
          printf 'unsigned_apk_name=Jarling-v%s-android-unsigned.apk\n' "$app_version" >> "$GITHUB_OUTPUT"
          printf 'unsigned_artifact_name=jarling-v%s-android-unsigned\n' "$app_version" >> "$GITHUB_OUTPUT"

      - name: Build the unsigned release APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Package the unsigned APK
        shell: bash
        env:
          UNSIGNED_APK_NAME: ${{ steps.metadata.outputs.unsigned_apk_name }}
        run: |
          mapfile -t release_apks < <(
            find android/app/build/outputs/apk/release \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print
          )

          if [[ "${#release_apks[@]}" -ne 1 ]]; then
            echo "Expected exactly one unsigned release APK, found ${#release_apks[@]}." >&2
            exit 1
          fi

          mkdir -p unsigned-artifact
          cp "${release_apks[0]}" "unsigned-artifact/$UNSIGNED_APK_NAME"

      - name: Store the unsigned APK temporarily
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ${{ steps.metadata.outputs.unsigned_artifact_name }}
          path: unsigned-artifact/${{ steps.metadata.outputs.unsigned_apk_name }}
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign APK in isolation
    needs: build
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: android-release

    steps:
      - name: Download the unsigned APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.unsigned_artifact_name }}
          path: unsigned-artifact

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Locate Android signing tools
        id: android-tools
        shell: bash
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          build_tools_root="$sdk_root/build-tools"

          if [[ -z "$sdk_root" || ! -d "$build_tools_root" ]]; then
            echo "Android build tools are not installed on the runner." >&2
            exit 1
          fi

          mapfile -t versions < <(
            find "$build_tools_root" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' \
              | sort -V
          )

          if [[ "${#versions[@]}" -eq 0 ]]; then
            echo "No Android build-tools version was found." >&2
            exit 1
          fi

          tools_dir="$build_tools_root/${versions[-1]}"
          if [[ ! -x "$tools_dir/zipalign" || ! -x "$tools_dir/apksigner" ]]; then
            echo "The selected Android build-tools installation is incomplete." >&2
            exit 1
          fi

          printf 'directory=%s\n' "$tools_dir" >> "$GITHUB_OUTPUT"

      - name: Restore and validate the release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set +x
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || \
                -z "$ANDROID_KEYSTORE_PASSWORD" || \
                -z "$ANDROID_KEY_ALIAS" ]]; then
            echo "Missing Android keystore configuration." >&2
            exit 1
          fi

          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/jarling-release.jks"

          if ! keytool -list \
            -keystore "$RUNNER_TEMP/jarling-release.jks" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null 2>&1; then
            echo "The Android release keystore could not be validated." >&2
            exit 1
          fi

      - name: Align, sign, and verify the APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
          UNSIGNED_APK_NAME: ${{ needs.build.outputs.unsigned_apk_name }}
          ANDROID_TOOLS: ${{ steps.android-tools.outputs.directory }}
        run: |
          set +x
          if [[ -z "$ANDROID_KEYSTORE_PASSWORD" || \
                -z "$ANDROID_KEY_ALIAS" || \
                -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Missing Android signing configuration." >&2
            exit 1
          fi

          unsigned_apk="$GITHUB_WORKSPACE/unsigned-artifact/$UNSIGNED_APK_NAME"
          aligned_apk="$RUNNER_TEMP/jarling-release-aligned.apk"
          output_dir="$GITHUB_WORKSPACE/release-artifacts"
          signed_apk="$output_dir/$APK_NAME"

          if [[ ! -f "$unsigned_apk" ]]; then
            echo "The unsigned APK artifact is missing." >&2
            exit 1
          fi

          if "$ANDROID_TOOLS/apksigner" verify "$unsigned_apk" >/dev/null 2>&1; then
            echo "The build artifact is already signed; refusing to sign it again." >&2
            exit 1
          fi

          mkdir -p "$output_dir"
          "$ANDROID_TOOLS/zipalign" -f -p 4 "$unsigned_apk" "$aligned_apk"
          "$ANDROID_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/jarling-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$signed_apk" \
            "$aligned_apk"
          "$ANDROID_TOOLS/apksigner" verify "$signed_apk" >/dev/null

          (
            cd "$output_dir"
            sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          )

      - name: Remove sensitive and intermediate files
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/jarling-release.jks"
          rm -f "$RUNNER_TEMP/jarling-release-aligned.apk"

      - name: Store the signed APK temporarily
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ${{ needs.build.outputs.signed_artifact_name }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Attach APK to GitHub Release
    if: ${{ inputs.release_tag != '' }}
    needs: sign
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download the signed APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jarling-${{ inputs.release_tag }}-android-signed
          path: release-artifacts

      - name: Attach immutable assets to the existing GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          APK_PATH: release-artifacts/Jarling-${{ inputs.release_tag }}-android.apk
          CHECKSUM_PATH: release-artifacts/Jarling-${{ inputs.release_tag }}-android.apk.sha256
        run: |
          if [[ ! -f "$APK_PATH" || ! -f "$CHECKSUM_PATH" ]]; then
            echo "The signed APK or its checksum is missing from the downloaded artifact." >&2
            exit 1
          fi

          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" \
            "$APK_PATH" \
            "$CHECKSUM_PATH"
